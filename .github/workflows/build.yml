name: build

on:
  schedule:
    - cron: "30 7 * * *" # daily, after Universal Blue's nightly builds
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the Aurora base image has not changed
        type: boolean
        default: false

concurrency:
  group: build
  cancel-in-progress: false

env:
  BASE_IMAGE: ghcr.io/ublue-os/aurora-dx-nvidia-open:stable
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read base image kernel and digest
        id: base
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          inspect="$(skopeo inspect "docker://${BASE_IMAGE}")"
          kernel="$(jq -r '.Labels["ostree.linux"]' <<<"$inspect")"
          version="$(jq -r '.Labels["org.opencontainers.image.version"]' <<<"$inspect")"
          digest="$(jq -r '.Digest' <<<"$inspect")"
          fedora="${version%%.*}"
          echo "kernel=${kernel} fedora=${fedora} version=${version} digest=${digest}"
          echo "kernel=${kernel}" >> "$GITHUB_OUTPUT"
          echo "fedora=${fedora}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

          # Skip scheduled runs when our latest image was already built from this base.
          built_from="$(skopeo inspect "docker://${IMAGE}:latest" 2>/dev/null \
            | jq -r '.Labels["io.github.aurora-razer.base-digest"] // empty' || true)"
          if [[ "${{ github.event_name }}" == "schedule" && "${built_from}" == "${digest}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Base image unchanged; nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check prebuilt OpenRazer driver exists for this kernel
        if: steps.base.outputs.skip != 'true'
        run: |
          skopeo inspect --raw \
            "docker://ghcr.io/ublue-os/akmods:main-${{ steps.base.outputs.fedora }}-${{ steps.base.outputs.kernel }}" >/dev/null

      - name: Free disk space
        if: steps.base.outputs.skip != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: Build
        if: steps.base.outputs.skip != 'true'
        run: |
          set -euo pipefail
          podman build \
            --build-arg BASE_IMAGE="${BASE_IMAGE%:*}@${{ steps.base.outputs.digest }}" \
            --build-arg FEDORA_VERSION="${{ steps.base.outputs.fedora }}" \
            --build-arg KERNEL_VERSION="${{ steps.base.outputs.kernel }}" \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            --label org.opencontainers.image.version="${{ steps.base.outputs.version }}" \
            --label io.github.aurora-razer.base-digest="${{ steps.base.outputs.digest }}" \
            -t "${{ steps.base.outputs.image }}:latest" \
            -t "${{ steps.base.outputs.image }}:${{ steps.base.outputs.version }}" \
            .

      - name: Push
        if: steps.base.outputs.skip != 'true' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push "${{ steps.base.outputs.image }}:${{ steps.base.outputs.version }}"
          podman push "${{ steps.base.outputs.image }}:latest"
